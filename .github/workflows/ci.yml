name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guitar-core:
    name: GuitarCore (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --package-path packages/GuitarCore

  app-syntax:
    name: visionOS app (syntax parse)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Full visionOS build needs the visionOS SDK + signing; until that's
      # configured, parse-check the sources so obvious breakage fails CI.
      - name: Parse app sources
        run: find apps/FretspaceVision/Sources -name '*.swift' -print0 | xargs -0 swiftc -parse
      - name: Validate project.yml
        run: |
          brew install xcodegen
          cd apps/FretspaceVision && xcodegen generate

  app-build:
    name: visionOS app (simulator build)
    runs-on: macos-15
    # Advisory while runner Xcode/platform availability settles; the parse
    # job above stays the required gate.
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: xcodebuild -version && xcrun simctl list runtimes || true
      - name: Install visionOS platform if missing
        run: |
          xcrun simctl list runtimes | grep -qi visionos || sudo xcodebuild -downloadPlatform visionOS
      - name: Generate project
        run: |
          brew install xcodegen
          cd apps/FretspaceVision && xcodegen generate
      - name: Build for visionOS Simulator
        run: |
          set -o pipefail
          cd apps/FretspaceVision
          xcodebuild build -scheme FretspaceVision \
            -destination 'generic/platform=visionOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -120

  backend:
    name: Backend (vitest + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  web:
    name: Web (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
