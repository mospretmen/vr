<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="Fretspace overlays scales, chords, and triads on your real guitar through Apple Vision Pro. See the fretboard. In the room."
    />
    <title>Fretspace — See the fretboard. In the room.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      /* data-theme boot: apply the saved choice before first paint. */
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="description" content="Fretspace — the Harmony Compass for guitar. A navigable map of harmony: tap any chord, hear it, see scales, grips and voice leading. Free on the web; built for Apple Vision Pro." />
  <meta property="og:title" content="Fretspace — the Harmony Compass for guitar" />
  <meta property="og:description" content="Harmony as a map you can walk. Tap chords, hear plucked strings, learn real grips and classic phrases — free in your browser." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://vr-music-app.netlify.app/" />
  <meta property="og:image" content="https://vr-music-app.netlify.app/media/shot-compass.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Fretspace — the Harmony Compass for guitar" />
  <meta name="twitter:image" content="https://vr-music-app.netlify.app/media/shot-compass.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
